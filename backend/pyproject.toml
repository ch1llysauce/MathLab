[project]
name = "mathlab-backend"
version = "0.1.0"
description = "MathLab modular monolith backend"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sympy>=1.13.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "psycopg[binary]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
